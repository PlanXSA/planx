<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plan X</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: Tahoma, sans-serif; }
      #layout { display: grid; grid-template-columns: 220px 1fr 280px; grid-template-rows: 44px 1fr; height: 100%; }
      #phase { grid-column: 1 / 4; background: #111; color: #fff; display: flex; align-items: center; gap: 16px; padding: 0 12px; font-size: 14px; }
      #tools { background: #1c1c1c; color: #eee; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
      #map { min-width: 0; }
      #table { background: #f4f4f4; overflow: auto; font-size: 12px; padding: 8px; }
      button { width: 100%; padding: 8px; cursor: pointer; }
      button.active { outline: 2px solid #f97316; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border-bottom: 1px solid #ddd; padding: 4px; text-align: right; }
    </style>
  </head>
  <body>
    <div id="layout">
      <div id="phase">Plan X · <span id="status">اختر أداة</span></div>
      <div id="tools">
        <button id="import">استيراد المربع</button>
        <button id="draw-parcel">رسم قطعة</button>
        <button id="draw-street">رسم شارع</button>
        <button id="cancel">إلغاء المسودة</button>
        <button id="save">حفظ الملف</button>
        <button id="open">فتح ملف</button>
        <input id="open-file" type="file" accept="application/json,.json" hidden />
        <p style="font-size:12px;opacity:.8">نقرة تضيف رأساً. النقرة المزدوجة تغلق وتبني الجدول. الحفظ الآن لقطة JSON حتى يقلع DuckDB.</p>
        <strong style="font-size:12px">تعارضات</strong>
        <ul id="conflicts" style="font-size:12px;padding-right:16px;"></ul>
      </div>
      <div id="map"></div>
      <div id="table">
        <strong>سجل المعالم</strong>
        <table>
          <thead><tr><th>نوع</th><th>مصدر</th><th>مساحة م²</th><th>طول م</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
